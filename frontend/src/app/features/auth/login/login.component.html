<div class="login-page">
  <div class="login-card-wrapper">
    <mat-card class="login-card">
      <div class="login-header">
        <div class="brand-badge">
          <mat-icon>payments</mat-icon>
        </div>
        <h1 class="portal-title">ACME HR Portal</h1>
        <p class="portal-subtitle">Employee Salary Management System</p>
      </div>

      <mat-card-content>
        <div class="error-alert" *ngIf="errorMessage()">
          <mat-icon>error_outline</mat-icon>
          <span>{{ errorMessage() }}</span>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" placeholder="e.g. admin" autocomplete="username">
            <mat-icon matPrefix>person</mat-icon>
            <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
              Username is required
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password" autocomplete="current-password">
            <mat-icon matPrefix>lock</mat-icon>
            <button mat-icon-button matSuffix (click)="togglePasswordVisibility()" type="button" [attr.aria-label]="'Hide password'">
              <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
              Password is required
            </mat-error>
          </mat-form-field>

          <button mat-flat-button color="primary" class="full-width submit-btn" type="submit" [disabled]="isLoading()">
            <mat-spinner diameter="20" *ngIf="isLoading()"></mat-spinner>
            <span *ngIf="!isLoading()">Sign In</span>
          </button>
        </form>

        <div class="preset-section">
          <span class="preset-label">Test Evaluation Accounts:</span>
          <div class="preset-chips">
            <button mat-stroked-button color="primary" type="button" class="preset-btn" (click)="setPresetCredentials('admin')">
              <mat-icon>admin_panel_settings</mat-icon> Admin
            </button>
            <button mat-stroked-button color="accent" type="button" class="preset-btn" (click)="setPresetCredentials('manager')">
              <mat-icon>manage_accounts</mat-icon> Manager
            </button>
            <button mat-stroked-button type="button" class="preset-btn" (click)="setPresetCredentials('viewer')">
              <mat-icon>visibility</mat-icon> Viewer
            </button>
          </div>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
