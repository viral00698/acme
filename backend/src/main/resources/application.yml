spring:
  application:
    name: acme-salary-management
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:900000} # 15 minutes
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80,http://127.0.0.1:4200}
  pagination:
    default-page-size: 20
    max-page-size: 100
  seed:
    enabled: ${SEED_INITIAL_DATA:false}
    employee-count: ${SEED_EMPLOYEE_COUNT:10000}
    admin-password: ${SEED_ADMIN_PASSWORD:Admin@Acme2026!}
    manager-password: ${SEED_MANAGER_PASSWORD:Manager@Acme2026!}
    viewer-password: ${SEED_VIEWER_PASSWORD:Viewer@Acme2026!}
